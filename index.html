<title>Astro Paquita — Prévisualisation V161</title>
<style>
html,body{margin:0;min-height:100%;background:#f7efe5;color:#4b2149;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{display:grid;place-items:center;min-height:100vh}.boot{padding:28px;text-align:center}.moon{font-size:44px}.boot p{margin:12px 0 0;color:#75646d;font-size:14px}

<body>
<div class="boot"><div class="moon">☾</div><strong>Astro Paquita</strong><p>Chargement de la prévisualisation…</p></div>
<script>
(async()=>{
  const target='/app-v121.html?preview=20260927-v161d';
  try{
    if('serviceWorker' in navigator){
      const reg=await navigator.serviceWorker.register('/sw-v161-preview.js?v=20260927-v161d',{scope:'/',updateViaCache:'none'});
      await reg.update();
      await navigator.serviceWorker.ready;
      if(!navigator.serviceWorker.controller){
        await new Promise(resolve=>{
          let done=false;
          const finish=()=>{if(done)return;done=true;resolve();};
          navigator.serviceWorker.addEventListener('controllerchange',finish,{once:true});
          setTimeout(finish,1400);
        });
      }
    }
  }catch(e){console.warn('Prévisualisation: service worker',e);}
  location.replace(target);
})();
</script>
</body>
</html>
