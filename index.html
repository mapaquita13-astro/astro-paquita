<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Astro Paquita — Prévisualisation V169</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7efe5;color:#4b2149;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#ap-preview-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f7efe5;visibility:hidden}
#ap-preview-boot{position:fixed;inset:0;display:grid;place-items:center;background:#f7efe5;z-index:10}
.ap-boot-card{text-align:center;padding:28px}.ap-moon{font-size:44px}.ap-boot-card p{margin:12px 0 0;color:#75646d;font-size:14px}
#ap-preview-error{display:none;max-width:520px;padding:24px;text-align:center;line-height:1.55}.ap-error-title{font:600 28px Georgia,serif;margin-bottom:10px}.ap-error-code{font-size:12px;color:#7d6a74;margin-top:12px}
</style>
</head>
<body>
<div id="ap-preview-boot"><div class="ap-boot-card" id="ap-boot-card"><div class="ap-moon">☾</div><strong>Astro Paquita</strong><p>Chargement de la nouvelle interface…</p></div><div id="ap-preview-error"><div class="ap-error-title">Prévisualisation indisponible</div><div id="ap-preview-error-text"></div><div class="ap-error-code">V169 — aucune ancienne interface ne sera affichée en secours.</div></div></div>
<iframe id="ap-preview-frame" title="Astro Paquita V169"></iframe>
<script>
(()=>{
 'use strict';
 const VERSION='20260927-v169';
 const API_ORIGIN='https://astro-paquita-backend.onrender.com';
 const frame=document.getElementById('ap-preview-frame');
 const boot=document.getElementById('ap-preview-boot');
 const card=document.getElementById('ap-boot-card');
 const err=document.getElementById('ap-preview-error');
 const errText=document.getElementById('ap-preview-error-text');
 let done=false;
 const sleep=ms=>new Promise(r=>setTimeout(r,ms));
 const fail=msg=>{if(done)return;done=true;frame.style.visibility='hidden';card.style.display='none';err.style.display='block';errText.textContent=msg||'La nouvelle interface n’a pas pu démarrer.';};
 async function clearOldWorkers(){
   try{if('serviceWorker' in navigator){for(const reg of await navigator.serviceWorker.getRegistrations())await reg.unregister();}}catch(e){}
   try{if('caches' in window){for(const key of await caches.keys())await caches.delete(key);}}catch(e){}
 }
 function patchApiFetch(w){
   if(w.__AP_V169_API_PATCH__)return;
   const original=w.fetch.bind(w);
   const origin=w.location.origin;
   w.fetch=function(input,init){
     try{
       if(typeof input==='string'){
         if(input.startsWith('/api/'))return original(API_ORIGIN+input,init);
         if(input.startsWith(origin+'/api/'))return original(API_ORIGIN+input.slice(origin.length),init);
       }
     }catch(e){}
     return original(input,init);
   };
   w.__AP_V169_API_PATCH__=true;
 }
 function addStyle(d){
   if(d.getElementById('ap-v162-gate-style'))return;
   const s=d.createElement('style');s.id='ap-v162-gate-style';s.textContent=`
     html,body{margin:0!important;min-height:100%!important;background:#f8f1e7!important;}
     body{overflow:hidden!important;}
     #ap-final-root{position:fixed!important;inset:0!important;display:block!important;visibility:visible!important;z-index:2147483000!important;overflow:auto!important;background:#f8f1e7!important;}
     #modal-compte,.ap-toast{z-index:2147483647!important;}
     #ap-auth-forgot{display:block;width:100%;margin:10px 0 2px;border:0;background:transparent;color:#6a2a61;font:700 14px/1.3 Lato,Arial,sans-serif;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:5px;}
   `;d.head.appendChild(s);
 }
 function ensureCss(d){
   const existing=[...d.querySelectorAll('link[rel="stylesheet"]')].find(x=>(x.getAttribute('href')||'').includes('refonte-final.css'));
   if(existing){existing.href='/assets/refonte-final.css?v='+VERSION;return;}
   const l=d.createElement('link');l.rel='stylesheet';l.href='/assets/refonte-final.css?v='+VERSION;d.head.appendChild(l);
 }
 function loadScript(d,src){return new Promise((resolve,reject)=>{const s=d.createElement('script');s.src=src+(src.includes('?')?'&':'?')+'v='+VERSION;s.onload=resolve;s.onerror=()=>reject(new Error('Chargement impossible : '+src));d.body.appendChild(s);});}
 function installForgotPassword(d,w){
   const submit=d.getElementById('ap-auth-submit');
   if(!submit||d.getElementById('ap-auth-forgot'))return;
   const b=d.createElement('button');b.type='button';b.id='ap-auth-forgot';b.textContent='Mot de passe oublié ?';submit.insertAdjacentElement('afterend',b);
   b.onclick=async()=>{
     const email=(d.getElementById('ap-auth-email')?.value||'').trim();
     const e=d.getElementById('ap-auth-error');
     if(!email){if(e){e.textContent='Saisis d’abord ton adresse e-mail.';e.classList.add('show');}return;}
     b.disabled=true;b.textContent='Envoi du lien…';
     try{
       const r=await w.fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
       const data=await r.json().catch(()=>({}));
       if(!r.ok)throw new Error(data.erreur||'Demande impossible.');
       if(e){e.textContent=data.email_configured===false?'La réinitialisation existe, mais l’envoi d’e-mail n’est pas encore configuré sur le serveur.':(data.message||'Si un compte existe avec cet e-mail, un lien de réinitialisation va être envoyé.');e.classList.add('show');}
     }catch(x){if(e){e.textContent=x.message||'Envoi du lien impossible.';e.classList.add('show');}}
     finally{b.disabled=false;b.textContent='Mot de passe oublié ?';}
   };
 }
 async function forceNewInterface(){
   let w,d,root;
   try{w=frame.contentWindow;d=frame.contentDocument;root=d&&d.getElementById('ap-final-root');}catch(e){fail('La page de prévisualisation n’est pas accessible.');return;}
   if(!d||!root){fail('Le socle V121 ne contient pas le point de montage de la nouvelle interface.');return;}
   patchApiFetch(w);addStyle(d);ensureCss(d);
   try{if(w.navigator&&'serviceWorker' in w.navigator){for(const reg of await w.navigator.serviceWorker.getRegistrations())await reg.unregister();}}catch(e){}
   for(let i=0;i<16&&!w.AstroTruth;i++)await sleep(125);
   if(!w.AstroTruth){try{await loadScript(d,'/assets/truth-engine.js');}catch(e){fail('Le moteur astrologique V121/V169 n’a pas pu être chargé.');return;}}
   try{await loadScript(d,'/assets/v162-runtime-fix.js');}catch(e){fail('Le raccord des prévisions n’a pas pu être chargé.');return;}
   try{await loadScript(d,'/assets/v162-markdown-fix.js');}catch(e){fail('Le rendu des interprétations n’a pas pu être chargé.');return;}
   try{await loadScript(d,'/assets/v169-natal-houses.js');}catch(e){fail('Le raccord des maisons natales V121 n’a pas pu être chargé.');return;}
   for(let i=0;i<16&&!root.querySelector('.ap-shell,.ap-auth-shell');i++)await sleep(125);
   if(!root.querySelector('.ap-shell,.ap-auth-shell')){
     try{await loadScript(d,'/assets/refonte-final.js');}catch(e){fail('La nouvelle interface V169 n’a pas pu être chargée.');return;}
   }
   for(let i=0;i<28&&!root.querySelector('.ap-shell,.ap-auth-shell');i++)await sleep(125);
   const mounted=root.querySelector('.ap-shell,.ap-auth-shell');
   if(!mounted){fail('Le moteur est présent, mais la nouvelle interface ne s’est pas initialisée.');return;}
   installForgotPassword(d,w);
   const authObs=new MutationObserver(()=>installForgotPassword(d,w));authObs.observe(root,{childList:true,subtree:true});
   d.body.classList.add('ap-final-active');
   root.style.setProperty('display','block','important');
   root.style.setProperty('visibility','visible','important');
   frame.style.visibility='visible';boot.style.display='none';done=true;
 }
 frame.addEventListener('load',()=>{setTimeout(forceNewInterface,80);},{once:true});
 (async()=>{await clearOldWorkers();frame.src='/app-v121.html?preview='+VERSION+'&nocache='+Date.now();setTimeout(()=>{if(!done)fail('Le chargement dépasse le délai prévu. Réessayez en actualisant cette page.');},12000);})();
})();
</script>
</body>
</html>
