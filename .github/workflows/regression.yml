name: Anti-régression Astro Paquita
on:
  pull_request:
  push:
    branches: [main, correctifs-audit-20261009]
jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Vérification source et tests
        run: node --test tests/*.test.js
