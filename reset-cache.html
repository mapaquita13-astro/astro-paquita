<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astro Paquita — Mise à jour</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#32102f;color:#fff7ea;font-family:Arial,sans-serif}.box{text-align:center;padding:32px}.star{font-size:42px;color:#e7bd70}.small{opacity:.8;margin-top:10px}</style></head><body><div class="box"><div class="star">✦</div><h2>Mise à jour d’Astro Paquita</h2><div class="small" id="msg">Nettoyage de l’ancienne version…</div></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}document.getElementById('msg').textContent='Terminé. Ouverture de la nouvelle version…';setTimeout(()=>location.replace('/?v=37-clean-20260812-'+Date.now()),700);}catch(e){location.replace('/?v=37-clean-20260812-'+Date.now());}})();</script></body></html>
